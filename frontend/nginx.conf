# Static files only. Routing, rate limiting and body limits live in the gateway (nginx/nginx.conf).
server {
    listen 80;
    root /usr/share/nginx/html;

    # React routes (/view/:id) fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # A missing hashed bundle must 404, not return index.html as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }
}
