[project]
name = "snippet-share-secret-scanner"
version = "0.1.0"
description = "Stateless MCP server that finds and redacts secrets in text before it is shared"
requires-python = ">=3.12"
dependencies = [
    # shortcut: pinned to 4.x because google-adk 2.13 caps opentelemetry-sdk<=1.44; move to 5.x when ADK lifts it
    "langfuse==4.15.6",
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Packaged so the agent and mcp-server share one redact() rule set. server.py stays out: mcp-server has its own.
[tool.hatch.build.targets.wheel]
only-include = ["scanner.py", "snippet_tracing.py"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
