# Dev override, layered on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Publishes db and backend on localhost only, and reloads the backend on code changes.
# Run the frontend on the host with `bun run dev` (proxies /api to :8000).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
