[project]
name = "snippet-share-mcp"
version = "0.1.0"
description = "MCP server that lets coding agents share text as a snippet-share link"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # shortcut: pinned to 4.x because google-adk 2.13 caps opentelemetry-sdk<=1.44; move to 5.x when ADK lifts it
    "langfuse==4.15.6",
    "mcp>=2.3.0",
    "pyjwt>=2.10.0",
    "snippet-share-secret-scanner",  # snippet_tracing: the same redact() masks every exported span
]

[tool.uv.sources]
snippet-share-secret-scanner = { path = "../mcp-secret-scanner", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
