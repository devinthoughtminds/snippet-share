# Gateway: the only service published to the host.
# /api/* goes to the backend, everything else to the frontend.
# Mounted into nginx:alpine as /etc/nginx/conf.d/default.conf (inside the http block).

# shortcut: Docker Desktop NATs every client to the bridge IP, so locally all users share one bucket; on a Linux host the real IP arrives. Behind another proxy/LB, switch to set_real_ip_from + real_ip_header.
limit_req_zone $binary_remote_addr zone=create:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Look containers up through Docker's DNS on each request (cached 10s), not once at startup:
# a recreated container gets a new IP, and a startup-time lookup would keep the stale one (502) or fail (crash).
# proxy_pass only re-resolves when given a variable, hence the `set` lines below.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $backend  http://backend:8000;
    set $frontend http://frontend:80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Create: exact match, so only POST /api/v1/pastes is rate limited.
    # 2 MB body cap: JSON escaping makes the body larger than the text;
    # the backend enforces the real 1 MB text limit.
    location = /api/v1/pastes {
        limit_req zone=create burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass $backend;
    }

    # Read, raw, and API docs: not rate limited.
    location /api/ {
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
    }
}

# MCP server: its own port, because its /login, /token and /.well-known paths would clash with the frontend's.
server {
    listen 8001;
    server_name _;

    set $mcp http://mcp:8001;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Password guessing: POSTs to the login form are rate limited.
    location = /login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $mcp;
    }

    # Streamable HTTP can hold a response open and stream events: no buffering, long reads.
    location / {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass $mcp;
    }
}
