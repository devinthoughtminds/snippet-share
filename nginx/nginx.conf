# Gateway: the only service published to the host.
# /api/* goes to the backend, everything else to the frontend.
# Mounted into nginx:alpine as /etc/nginx/conf.d/default.conf (inside the http block).

# shortcut: Docker Desktop NATs every client to the bridge IP, so locally all users share one bucket; on a Linux host the real IP arrives. Behind another proxy/LB, switch to set_real_ip_from + real_ip_header.
limit_req_zone $binary_remote_addr zone=create:10m rate=10r/m;

upstream backend  { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Create: exact match, so only POST /api/v1/pastes is rate limited.
    # 2 MB body cap: JSON escaping makes the body larger than the text;
    # the backend enforces the real 1 MB text limit.
    location = /api/v1/pastes {
        limit_req zone=create burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass http://backend;
    }

    # Read, raw, and API docs: not rate limited.
    location /api/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
